name = "tabletop-tools-admin"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets — set via: wrangler secret put TURSO_DB_URL
# wrangler secret put TURSO_AUTH_TOKEN
# wrangler secret put ADMIN_EMAILS

# Workers AI — used by the crosswalk LLM evaluator (Phase 1.4 step 10).
# Access via env.AI.run(...) per Cloudflare Workers AI binding convention.
[ai]
binding = "AI"

[[services]]
binding = "BCP_SCRAPER"
service = "tabletop-tools-bcp-scraper"

[[services]]
binding = "CONTENT_INGESTOR"
service = "tabletop-tools-content-ingestor-worker"
