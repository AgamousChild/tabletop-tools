name = "tabletop-tools-tournament"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Gates dev/test-only mutations (e.g. player.seedTestPlayers) — must stay
# "production" for the deployed Worker. See src/routers/player.ts.
[vars]
ENVIRONMENT = "production"

# Secrets — set via: wrangler secret put TURSO_DB_URL
# wrangler secret put TURSO_AUTH_TOKEN


[[kv_namespaces]]
binding = "AUTH_RATE_LIMIT"
id = "8290dc734d8847c893347e186b26aa38"
