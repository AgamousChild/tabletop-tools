name = "tabletop-tools-data-import"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "GAME_DATA_BUCKET"
bucket_name = "tabletop-tools-game-data"

[vars]
CORS_ORIGIN = "https://tabletop-tools.net"

# /sync runs the full ingest chain (Wahapedia CSV + BSData XML + MFM YAML +
# producers) in one invocation. The Paid-plan default of 30s CPU is too tight
# once 11e parsing and the canonical-content producers are in play — sync was
# returning Cloudflare 1102 (CPU exceeded). 5 min is the Paid-plan max.
[limits]
cpu_ms = 300000

# Secrets — set via: wrangler secret put SYNC_SECRET

[triggers]
crons = ["0 3 * * 1"]
