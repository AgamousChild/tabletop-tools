name = "tabletop-tools-data-import"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "GAME_DATA_BUCKET"
bucket_name = "tabletop-tools-game-data"

[vars]
CORS_ORIGIN = "https://tabletop-tools.net"

# Secrets — set via: wrangler secret put SYNC_SECRET

[triggers]
crons = ["0 3 * * 1"]
