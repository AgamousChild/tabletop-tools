name = "tabletop-tools-data-import"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "GAME_DATA_BUCKET"
bucket_name = "tabletop-tools-game-data"

[vars]
CORS_ORIGIN = "https://tabletop-tools.net"

# The Worker is a read-only proxy in front of R2 (/manifest.json and
# /data/:file). The sync pipeline runs in GitHub Actions
# (.github/workflows/sync-data.yml) — see CLAUDE.md Rule 9. No /sync
# endpoint, no cron, no elevated CPU cap required here.
