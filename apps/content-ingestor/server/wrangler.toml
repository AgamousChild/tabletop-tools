name = "tabletop-tools-content-ingestor-worker"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 30000

[[r2_buckets]]
binding = "BRAIN_BUCKET"
bucket_name = "tabletop-tools-brain"

[[vectorize]]
binding = "BRAIN_INDEX"
index_name = "brain-nodes"

[ai]
binding = "AI"

# Daily content discovery + processing (6am UTC)
[triggers]
crons = ["0 6 * * *"]
