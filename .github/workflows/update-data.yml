# update-data.yml — Trigger game data sync via Worker API
#
# Calls the data-import Worker's /sync endpoint to fetch fresh
# Wahapedia + BSData data, process it, and store in R2.
#
# The Worker also has its own cron trigger (Monday 3am UTC).
# This workflow serves as a manual trigger and backup schedule.
#
# Prerequisites:
#   - SYNC_SECRET secret: Bearer token matching the Worker's SYNC_SECRET

name: Update Game Data

on:
  schedule:
    # Weekly on Sunday at midnight UTC (backup — Worker cron runs Monday 3am)
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  SYNC_URL: https://tabletop-tools-data-import.micah-ec2.workers.dev/sync

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger data sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          echo "Triggering sync at $SYNC_URL"
          RESPONSE=$(curl -sf -X POST "$SYNC_URL" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 300)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Verify manifest
        run: |
          echo "Checking manifest..."
          curl -sf "${SYNC_URL%/sync}/manifest.json" | jq .
