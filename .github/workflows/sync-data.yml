# sync-data.yml — Run the data-import sync from CI and push outputs to R2
#
# Replaces the Worker's /sync endpoint and internal cron. The pipeline now runs
# on a GH Actions runner (no Worker CPU/wall-clock cap), captures every R2
# write into local files, then uploads each file to R2 via wrangler.
#
# Why not the Worker: BSData parsing across 30+ catalogs in one invocation
# busts the per-fetch-handler CPU cap (CF error 1102). Per CLAUDE.md Rule 9,
# heavy offline batch work doesn't belong on the edge.
#
# Prerequisites (org / repo secrets):
#   - CLOUDFLARE_API_TOKEN: Cloudflare API token with R2 + Workers Scripts: Edit
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare account id
#   (GITHUB_TOKEN is provided automatically by Actions for upstream GitHub API
#   rate-limit headroom on the BSData + MFM commit/tree lookups.)

name: Sync game data

on:
  schedule:
    # Weekly on Monday 03:00 UTC — matches the Worker cron we're retiring.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  R2_BUCKET: tabletop-tools-game-data

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run sync (Node)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter data-import-server exec tsx src/sync-cli.ts

      - name: Upload outputs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=".local/data-import-output"
          if [ ! -d "$out" ]; then
            echo "no output dir at $out — sync produced nothing?"
            exit 1
          fi
          count=0
          # `find` because `pnpm wrangler` startup overhead is meaningful per
          # call; we batch the env once and loop tightly.
          while IFS= read -r -d '' f; do
            key="${f#$out/}"
            pnpm --filter data-import-server exec wrangler r2 object put \
              "$R2_BUCKET/$key" --remote --file "$f"
            count=$((count + 1))
          done < <(find "$out" -type f -print0)
          echo "uploaded $count files to $R2_BUCKET"

      - name: Verify manifest
        run: |
          curl -sf 'https://tabletop-tools-data-import.micah-ec2.workers.dev/manifest.json' |
            jq '{version, updatedAt, mfm, bsdata: .bsdata.unitCount, wahapedia: (.wahapedia.recordCounts | length)}'
