# deploy-data-import.yml — Auto-deploy the data-import Worker on push to main
#
# The Worker is a read-only proxy in front of R2 (manifest + per-file JSON).
# The sync pipeline lives in sync-data.yml (GH Actions runner), not here.
#
# Prerequisites (org / repo secrets):
#   - CLOUDFLARE_API_TOKEN: Cloudflare API token with Workers Scripts: Edit
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare account id

name: Deploy data-import

on:
  push:
    branches: [main]
    paths:
      - 'apps/data-import/server/**'
      - 'packages/game-content/**'
      - '.github/workflows/deploy-data-import.yml'
  workflow_dispatch:

concurrency:
  group: deploy-data-import
  cancel-in-progress: false

env:
  MANIFEST_URL: https://tabletop-tools-data-import.micah-ec2.workers.dev/manifest.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test data-import server
        run: pnpm -F data-import-server test

      - name: Test game-content (BSData parser)
        run: pnpm -F @tabletop-tools/game-content test

      - name: Deploy data-import Worker
        # Use the workspace's own wrangler via pnpm — the cloudflare/wrangler-action
        # tries to `npm i` wrangler at the workspace root, which chokes on the
        # `workspace:*` protocol used throughout this monorepo.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter data-import-server exec wrangler deploy

      - name: Verify manifest still responds
        run: curl -sf "$MANIFEST_URL" | jq '{version, updatedAt}'
